<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA CASARA - Galleria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2c4a3e;
            --accent-color: #8c6d46;
            --bg-color: #f4f6f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- MENU IN ALTO --- */
        .navbar {
            background-color: #1c3028;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .navbar a:hover,
        .navbar a.active {
            background-color: var(--accent-color);
        }

        .gallery-wrapper {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .gallery-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .gallery-card h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 18px;
        }

        /* --- SCORRIMENTO FOTO --- */
        .photo-strip {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 12px;
        }

        .photo-slide {
            flex: 0 0 88%;
            scroll-snap-align: center;
            border-radius: 10px;
            overflow: hidden;
            background: #141a17;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .photo-slide {
                flex: 0 0 65%;
            }
        }

        .photo-slide img {
            width: 100%;
            height: 460px;
            object-fit: contain;
            display: block;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Pianificazione</a>
        <a href="galleria.html" class="active">Galleria</a>
    </nav>

    <main class="gallery-wrapper">
        <section class="gallery-card">
            <h1>📷 Foto dalla Casara</h1>

            <div class="photo-strip">
                <div class="photo-slide"><img src="IMG20251219153541.jpg" alt="Foto 1 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0007.jpg" alt="Foto 2 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0012.jpg" alt="Foto 3 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0013.jpg" alt="Foto 4 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0014.jpg" alt="Foto 5 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0016.jpg" alt="Foto 6 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0017.jpg" alt="Foto 7 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0018.jpg" alt="Foto 8 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0019.jpg" alt="Foto 9 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0032.jpg" alt="Foto 10 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0034.jpg" alt="Foto 11 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0040.jpg" alt="Foto 12 dalla casara"></div>
                <div class="photo-slide"><img src="IMG-20251221-WA0041.jpg" alt="Foto 13 dalla casara"></div>
            </div>

            <p class="hint">Scorri orizzontalmente per sfogliare tutte le foto (13).</p>
        </section>
    </main>

</body>
</html>
